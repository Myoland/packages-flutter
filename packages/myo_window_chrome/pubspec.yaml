name: myo_window_chrome
description: The title bar a dark desktop app's window wears. One treatment
  for macOS, Linux and Windows, applied by the plugin itself so no app has to
  edit its native runner.
version: 0.2.0
publish_to: 'none'
repository: https://github.com/Myoland/packages-flutter

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Every platform registers a class, and every one of them applies the
      # chrome as it registers — before the first frame, so the window is never
      # seen undressed. The method channel is only for changing that choice
      # afterwards.
      macos:
        pluginClass: MyoWindowChromePlugin
      linux:
        pluginClass: MyoWindowChromePlugin
      windows:
        pluginClass: MyoWindowChromePluginCApi
